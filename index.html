
<div class="modal" id="modal">
  <div class="modal-content">

    <button class="close" onclick="closeModal()">×</button>

    <div class="gift">🎁</div>
    <h2>SALDO GRATIS</h2>
    <p>Masukkan USER ID kamu</p>

    <div id="checkSection">
      <input
        type="text"
        id="userID"
        placeholder="Masukkan USER ID"
        maxlength="40"
      >

      <button class="main-button" onclick="checkAccount()">
        ✨ CEK AKUN ✨
      </button>
    </div>

    <div id="rewardSection" style="display:none">
      <p>SELAMAT! HADIAH SIMULASI KAMU:</p>

      <div class="reward-amount" id="rewardAmount">
        Rp0
      </div>

      <p class="disclaimer">
        Nominal ini merupakan hasil simulasi acak,
        bukan saldo atau hadiah uang sungguhan.
      </p>

      <button class="main-button" onclick="claimReward()">
        🎁 CLAIM 🎁
      </button>
    </div>

    <p id="message" class="message"></p>

  </div>
</div>
